global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: docker-containers
    static_configs:
      - targets: ["cadvisor:8080"]
        labels: {host: briq}
    relabel_configs:
      - target_label: instance
        replacement: briq

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]
        labels: {host: briq}
    relabel_configs:
      - target_label: instance
        replacement: briq

  - job_name: docker-containers-briq-large
    scrape_interval: 30s
    metrics_path: /cadvisor/metrics
    basic_auth:
      username: prometheus
      password_file: /etc/prometheus/secrets/briq-large.pass
    static_configs:
      - targets: ["metrics.briq-large.internal:80"]
        labels: {host: briq-large}
    relabel_configs:
      - target_label: instance
        replacement: briq-large

  - job_name: node-briq-large
    scrape_interval: 30s
    metrics_path: /node/metrics
    basic_auth:
      username: prometheus
      password_file: /etc/prometheus/secrets/briq-large.pass
    static_configs:
      - targets: ["metrics.briq-large.internal:80"]
        labels: {host: briq-large}
    relabel_configs:
      - target_label: instance
        replacement: briq-large
